server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location = / {
        return 301 /sigaplem/;
    }

    location = /sigaplem {
        return 301 /sigaplem/;
    }

    location /sigaplem/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /sigaplem/index.html;
    }

    location = /sigaplem/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}