server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Angular estará publicado bajo /sigaplem/
    location /sigaplem/ {
        try_files $uri $uri/ /index.html;
    }

    # Evita problemas si alguien entra directamente a la raíz del contenedor
    location = / {
        return 302 /sigaplem/;
    }

    # Cache para archivos estáticos generados por Angular
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # No guardar index.html en caché
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    client_max_body_size 50M;
}
