services:
  frontend:
    image: node:24-alpine
    container_name: sidocumentacion-frontend
    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      # Código Angular
      - .:/app

      # node_modules aislado dentro de Docker
      - frontend_node_modules:/app/node_modules

      # Evita montar el backend dentro del frontend
      - /app/backend

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: >
      sh -c "
      npm ci &&
      npm run start -- --host 0.0.0.0 --port 4200 --poll=1000
      "

    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sidocumentacion-backend
    working_dir: /app

    ports:
      - "3050:3050"

    volumes:
      # Código NestJS
      - ./backend:/app

      # node_modules aislado dentro de Docker
      - backend_node_modules:/app/node_modules

      # Persistencia de archivos
      - ./backend/storage:/app/storage

    env_file:
      - ./backend/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: >
      sh -c "
      npm ci &&
      npm run start:dev
      "

    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
